<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" role="img" aria-labelledby="ms-title ms-desc" width="320" height="280">
  <title id="ms-title">A booking calendar with a confirmed date</title>
  <desc id="ms-desc">A line drawing of a wall calendar with one date circled and checked in teal, representing booking the free twenty-minute tech check.</desc>
  <rect width="320" height="280" fill="#F3F2EC"/>

  <g fill="none" stroke="#4A4F55" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- calendar body -->
    <rect x="56" y="60" width="208" height="176" rx="10"/>
    <!-- header bar -->
    <line x1="56" y1="98" x2="264" y2="98"/>
    <!-- hanging rings -->
    <line x1="104" y1="44" x2="104" y2="74"/>
    <line x1="216" y1="44" x2="216" y2="74"/>
  </g>

  <!-- grid of day dots -->
  <g fill="#C9C7BF">
    <circle cx="92" cy="128" r="5"/><circle cx="128" cy="128" r="5"/><circle cx="164" cy="128" r="5"/><circle cx="200" cy="128" r="5"/><circle cx="236" cy="128" r="5"/>
    <circle cx="92" cy="168" r="5"/><circle cx="128" cy="168" r="5"/><circle cx="200" cy="168" r="5"/><circle cx="236" cy="168" r="5"/>
    <circle cx="92" cy="208" r="5"/><circle cx="128" cy="208" r="5"/><circle cx="164" cy="208" r="5"/><circle cx="200" cy="208" r="5"/>
  </g>

  <!-- the chosen day: teal ring + check -->
  <circle cx="164" cy="168" r="18" fill="none" stroke="#0F5C57" stroke-width="2.4"/>
  <path d="M156 168 l6 6 l10 -12" fill="none" stroke="#0F5C57" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
